<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniBase</title>

    <!-- Google Fonts: Bebas Neue for logo/headings, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ── CSS Variables: our entire color palette lives here ── */
      :root {
        --bg-primary: #0a0a0f; /* deepest background */
        --bg-secondary: #111118; /* cards, navbar */
        --bg-card: #1a1a24; /* hover states */
        --accent: #e85d26; /* orange-red accent — like Crunchyroll */
        --accent-dim: #c44d1e;
        --text-primary: #f0f0f0;
        --text-muted: #888899;
        --text-dim: #444455;
        --border: rgba(255, 255, 255, 0.08);
        --radius: 8px;
      }

      /* ── Reset & base ── */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
      }

      /* ── Navbar ── */
      nav {
        position: sticky; /* stays at top when you scroll */
        top: 0;
        z-index: 100; /* sits above all other content */
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        padding: 0 2rem;
        height: 60px;
        display: flex;
        align-items: center;
        gap: 2rem;
      }

      .nav-logo {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.8rem;
        color: var(--accent);
        letter-spacing: 0.05em;
        text-decoration: none;
        flex-shrink: 0;
      }

      .nav-search {
        flex: 1; /* takes up all remaining space */
        max-width: 480px;
        position: relative;
      }

      .nav-search input {
        width: 100%;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.5rem 1rem 0.5rem 2.4rem;
        color: var(--text-primary);
        font-family: "Inter", sans-serif;
        font-size: 0.875rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .nav-search input:focus {
        border-color: var(--accent);
      }

      .nav-search::before {
        content: "⌕";
        position: absolute;
        left: 0.7rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 1rem;
        pointer-events: none;
      }

      .nav-links {
        margin-left: auto; /* pushes links to the right */
        display: flex;
        gap: 1.5rem;
      }

      .nav-links a {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        transition: color 0.2s;
      }

      .nav-links a:hover,
      .nav-links a.active {
        color: var(--text-primary);
      }

      /* ── Hero ── */
      .hero {
        position: relative;
        min-height: 420px;
        display: flex;
        align-items: flex-end; /* content sits at the bottom of the hero */
        padding: 3rem 2rem 2.5rem;
        overflow: hidden;
        border-bottom: 1px solid var(--border);
      }

      .hero-bg {
        position: absolute;
        inset: 0; /* shorthand for top/right/bottom/left: 0 */
        background-size: cover;
        background-position: center top;
        filter: blur(18px) brightness(0.35);
        transform: scale(1.1); /* scale prevents blur edges showing */
        z-index: 0;
      }

      .hero-content {
        position: relative;
        z-index: 1; /* sits above the blurred background */
        display: flex;
        gap: 2rem;
        align-items: flex-end;
        max-width: 900px;
      }

      .hero-cover {
        width: 140px;
        height: 200px;
        object-fit: cover; /* fills box without stretching */
        border-radius: var(--radius);
        flex-shrink: 0;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      }

      .hero-cover-placeholder {
        width: 140px;
        height: 200px;
        background: var(--bg-card);
        border-radius: var(--radius);
        flex-shrink: 0;
      }

      .hero-info {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .hero-label {
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
      }

      .hero-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: 3.5rem;
        line-height: 1;
        color: var(--text-primary);
      }

      .hero-genres {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .genre-pill {
        font-size: 0.72rem;
        padding: 0.25rem 0.75rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--text-muted);
        background: rgba(255, 255, 255, 0.05);
      }

      .hero-score {
        font-size: 0.875rem;
        color: var(--text-muted);
      }

      .hero-score span {
        color: #f5c518; /* IMDb gold color for score */
        font-weight: 600;
        font-size: 1.1rem;
      }

      .hero-btn {
        display: inline-block;
        margin-top: 0.25rem;
        padding: 0.6rem 1.5rem;
        background: var(--accent);
        color: white;
        border-radius: 6px;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: background 0.2s;
        width: fit-content;
      }

      .hero-btn:hover {
        background: var(--accent-dim);
      }

      /* ── Trending Sections ── */
      .section {
        padding: 2rem;
        border-bottom: 1px solid var(--border);
      }

      .section-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }

      .section-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.6rem;
        letter-spacing: 0.04em;
        color: var(--text-primary);
      }

      .section-type-badge {
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.2rem 0.6rem;
        border-radius: 4px;
        background: var(--accent);
        color: white;
      }

      /* Horizontal scrollable row */
      .cards-row {
        display: flex;
        gap: 1rem;
        overflow-x: auto; /* enables horizontal scroll */
        padding-bottom: 0.75rem;
        scrollbar-width: thin; /* Firefox: thin scrollbar */
        scrollbar-color: var(--border) transparent;
      }

      /* Chrome scrollbar styling */
      .cards-row::-webkit-scrollbar {
        height: 4px;
      }
      .cards-row::-webkit-scrollbar-track {
        background: transparent;
      }
      .cards-row::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }

      /* Individual card */
      .media-card {
        flex-shrink: 0; /* cards don't shrink — they scroll */
        width: 130px;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .media-card:hover {
        transform: translateY(-4px); /* lifts card up on hover */
      }

      .media-card img {
        width: 130px;
        height: 185px;
        object-fit: cover;
        border-radius: var(--radius);
        display: block;
        background: var(--bg-card); /* shows while image loads */
      }

      .card-title {
        font-size: 0.78rem;
        color: var(--text-primary);
        margin-top: 0.5rem;
        line-height: 1.3;
        /* Clamp to 2 lines max */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .card-score {
        font-size: 0.72rem;
        color: var(--text-muted);
        margin-top: 0.2rem;
      }

      /* ── Footer ── */
      footer {
        padding: 2rem;
        text-align: center;
        font-size: 0.8rem;
        color: var(--text-dim);
      }
    </style>
  </head>

  <body>
    <!-- ① NAVBAR -->
    <nav>
      <a href="/" class="nav-logo">AniBase</a>

      <div class="nav-search">
        <input
          type="text"
          id="searchInput"
          placeholder="Search anime, manga..."
        />
      </div>

      <div class="nav-links">
        <a href="#anime" class="active">Anime</a>
        <a href="#manga">Manga</a>
      </div>
    </nav>

    <!-- ② HERO -->
    <section class="hero" id="hero">
      <div class="hero-bg" id="heroBg"></div>
      <div class="hero-content">
        <img class="hero-cover" id="heroCover" src="" alt="" />
        <div class="hero-info">
          <div class="hero-label">Most Popular Right Now</div>
          <div class="hero-title" id="heroTitle">Loading...</div>
          <div class="hero-genres" id="heroGenres"></div>
          <div class="hero-score">Score: <span id="heroScore">—</span></div>
          <button class="hero-btn" id="heroBtn">View Details →</button>
        </div>
      </div>
    </section>
    <!-- ③ TRENDING ANIME -->
    <section class="section" id="anime">
      <div class="section-header">
        <span class="section-title">Trending Anime</span>
        <span class="section-type-badge">Anime</span>
      </div>
      <div class="cards-row" id="animeRow"></div>
    </section>

    <!-- ③ TRENDING MANGA -->
    <section class="section" id="manga">
      <div class="section-header">
        <span class="section-title">Trending Manga</span>
        <span class="section-type-badge">Manga</span>
      </div>
      <div class="cards-row" id="mangaRow"></div>
    </section>

    <!-- ④ FOOTER -->
    <footer>
      AniBase &nbsp;·&nbsp; Data from AniList API &nbsp;·&nbsp; Built with
      FastAPI + PostgreSQL
    </footer>

    <script>
      const API = "http://localhost:8000";

      // ── Hero ──────────────────────────────────────────────
      async function loadHero() {
        // fetch() sends an HTTP GET request to your FastAPI
        // await means "wait here until the response comes back"
        const res = await fetch(`${API}/media/?type=ANIME&page=1&page_size=1`);

        // .json() parses the JSON text into a JavaScript object
        const data = await res.json();

        const media = data[0]; // grab first item (most popular)

        // Inject data into the HTML elements we made
        document.getElementById("heroTitle").textContent =
          media.title_english || media.title_romaji;

        document.getElementById("heroScore").textContent =
          media.average_score ?? "—";

        // Set cover image
        const cover = document.getElementById("heroCover");
        cover.src = media.cover_image_url || "";
        cover.alt = media.title_romaji;

        // Set blurred background to same image
        document.getElementById("heroBg").style.backgroundImage =
          `url('${media.cover_image_url}')`;

        // Render genre pills
        const genreContainer = document.getElementById("heroGenres");
        (media.genres || []).slice(0, 4).forEach((g) => {
          const pill = document.createElement("span");
          pill.className = "genre-pill";
          pill.textContent = g;
          genreContainer.appendChild(pill);
        });

        // Wire up the button (we'll make this navigate later)
        document.getElementById("heroBtn").onclick = () => {
          alert(`Navigate to media ID: ${media.id}`);
        };
      }

      // Run everything when the page loads
      loadHero();

      // ── Trending Rows ──────────────────────────────────────
      function createCard(media) {
        // Build one card element from a media object
        const card = document.createElement("div");
        card.className = "media-card";

        const title = media.title_english || media.title_romaji;
        const score = media.average_score
          ? `⭐ ${media.average_score}`
          : "No score";

        // innerHTML lets us write HTML as a string — faster for templates
        card.innerHTML = `
            <img src="${media.cover_image_url || ""}" alt="${title}" loading="lazy" />
            <div class="card-title">${title}</div>
            <div class="card-score">${score}</div>
        `;

        // Clicking a card will eventually navigate to detail page
        card.onclick = () => alert(`Navigate to media ID: ${media.id}`);

        return card;
      }

      async function loadTrending(type, containerId) {
        const res = await fetch(
          `${API}/media/?type=${type}&page=1&page_size=20`,
        );
        const items = await res.json();

        const container = document.getElementById(containerId);

        // forEach = Python's "for item in list"
        items.forEach((media) => {
          const card = createCard(media);
          container.appendChild(card); // add each card to the row
        });
      }

      // ── Run all loaders ────────────────────────────────────
      loadHero();
      loadTrending("ANIME", "animeRow");
      loadTrending("MANGA", "mangaRow");
    </script>
  </body>
</html>
