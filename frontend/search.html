<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search — AniBase</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Same CSS variables as index.html and detail.html ── */
      :root {
        --bg-primary: #0a0a0f;
        --bg-secondary: #111118;
        --bg-card: #1a1a24;
        --bg-card-hover: #202030;
        --accent: #e85d26;
        --accent-dim: #c44d1e;
        --text-primary: #f0f0f0;
        --text-muted: #888899;
        --text-dim: #444455;
        --border: rgba(255, 255, 255, 0.08);
        --radius: 8px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
      }

      /* ── Navbar (identical to other pages) ── */
      nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        padding: 0 2rem;
        height: 60px;
        display: flex;
        align-items: center;
        gap: 2rem;
      }
      .nav-logo {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.8rem;
        color: var(--accent);
        letter-spacing: 0.05em;
        text-decoration: none;
        flex-shrink: 0;
      }
      .nav-search {
        flex: 1;
        max-width: 480px;
        position: relative;
      }
      .nav-search input {
        width: 100%;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.5rem 1rem 0.5rem 2.4rem;
        color: var(--text-primary);
        font-family: "Inter", sans-serif;
        font-size: 0.875rem;
        outline: none;
        transition: border-color 0.2s;
      }
      .nav-search input:focus {
        border-color: var(--accent);
      }
      .nav-search::before {
        content: "⌕";
        position: absolute;
        left: 0.7rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 1rem;
        pointer-events: none;
      }
      .nav-links {
        margin-left: auto;
        display: flex;
        gap: 1.5rem;
      }
      .nav-links a {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        transition: color 0.2s;
      }
      .nav-links a:hover {
        color: var(--text-primary);
      }

      /* ── Search header ── */
      .search-header {
        padding: 2rem 2rem 0;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
      }
      .search-query-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.8rem;
        letter-spacing: 0.04em;
        color: var(--text-primary);
      }
      .search-query-title span {
        color: var(--accent);
      }
      .search-meta {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 0.3rem;
      }

      /* ── Results grid ── */
      .results-section {
        padding: 1.5rem 2rem;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
      }

      /*
        adaptive grid — auto-fill means "fit as many columns as possible"
        minmax(150px, 1fr) means each column is min 150px, max 1 fraction
        Result: on a wide screen ~8 cards per row, on narrow ~4
      */
      .results-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1.25rem;
      }

      /* Individual card — same style as homepage but fills grid cell */
      .media-card {
        cursor: pointer;
        transition: transform 0.2s;
      }
      .media-card:hover {
        transform: translateY(-4px);
      }

      .media-card img {
        width: 100%;
        aspect-ratio: 3 / 4; /* maintains poster ratio on any width */
        object-fit: cover;
        border-radius: var(--radius);
        display: block;
        background: var(--bg-card);
      }
      .card-title {
        font-size: 0.8rem;
        color: var(--text-primary);
        margin-top: 0.5rem;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card-meta {
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-top: 0.2rem;
      }
      .card-score {
        font-size: 0.72rem;
        color: var(--text-muted);
        margin-top: 0.1rem;
      }

      /* ── Empty state ── */
      .empty-state {
        display: none; /* hidden by default, shown by JS */
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 5rem 2rem;
        gap: 1rem;
        text-align: center;
      }
      .empty-state.visible {
        display: flex;
      }
      .empty-icon {
        font-size: 3rem;
        opacity: 0.3;
      }
      .empty-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.5rem;
        color: var(--text-muted);
      }
      .empty-sub {
        font-size: 0.85rem;
        color: var(--text-dim);
      }

      /* ── Loading spinner ── */
      /*
        The sentinel is an invisible div at the bottom of the grid.
        IntersectionObserver watches it — when it's visible, load more.
        The spinner shows while fetching.
      */
      .sentinel {
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 1rem 0;
      }
      .spinner {
        display: none; /* hidden until loading */
        width: 24px;
        height: 24px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      .spinner.visible {
        display: block;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── Initial prompt (before user types anything) ── */
      .start-prompt {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 6rem 2rem;
        gap: 1rem;
        text-align: center;
      }
      .start-prompt-icon {
        font-size: 3rem;
        opacity: 0.2;
      }
      .start-prompt-text {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.5rem;
        color: var(--text-muted);
        letter-spacing: 0.04em;
      }
      .start-prompt-sub {
        font-size: 0.85rem;
        color: var(--text-dim);
      }

      /* ── Skeletons ── */
      .skeleton-card {
        pointer-events: none;
      }
      .skeleton-img {
        width: 100%;
        aspect-ratio: 3 / 4;
        border-radius: var(--radius);
        background: var(--bg-card);
        overflow: hidden;
        position: relative;
      }
      .skeleton-line {
        height: 0.75rem;
        border-radius: 4px;
        background: var(--bg-card);
        margin-top: 0.5rem;
        overflow: hidden;
        position: relative;
      }
      .skeleton-line.short {
        width: 55%;
      }
      .skeleton-img::after,
      .skeleton-line::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.06) 50%,
          transparent 100%
        );
        animation: shimmer 1.4s infinite;
      }
      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      /* ── Mobile ── */
      @media (max-width: 768px) {
        /* Navbar */
        nav {
          padding: 0 1rem;
          gap: 1rem;
        }
        .nav-links {
          display: none;
        }
        .nav-search {
          max-width: none;
        }

        /* Search header */
        .search-header {
          padding: 1.25rem 1rem 0;
        }
        .search-query-title {
          font-size: 1.4rem;
        }

        /* Results grid — fewer columns on mobile */
        .results-section {
          padding: 1.25rem 1rem;
        }
        .results-grid {
          grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
          gap: 1rem;
        }
      }

      .nav-auth {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-left: 1rem;
      }

      .nav-auth a.btn-login {
        background: var(--accent);
        color: #fff;
        padding: 0.35rem 1rem;
        border-radius: 5px;
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.2s;
      }
      .nav-auth a.btn-login:hover {
        background: #c94e03;
      }

      .nav-auth .nav-username {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text);
        text-decoration: none;
      }
      .nav-auth .nav-username:hover {
        color: var(--accent);
      }

      .nav-auth button.btn-logout {
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 0.35rem 0.85rem;
        border-radius: 5px;
        font-family: "Inter", sans-serif;
        font-size: 0.85rem;
        cursor: pointer;
        transition:
          color 0.2s,
          border-color 0.2s;
      }
      .nav-auth button.btn-logout:hover {
        color: var(--text);
        border-color: var(--text);
      }
    </style>
  </head>

  <body>
    <!-- ① NAVBAR -->
    <nav>
      <a href="/" class="nav-logo">AniBase</a>
      <div class="nav-search">
        <!--
          id="searchInput" — JS reads from this
          autofocus — cursor lands here immediately on page load
        -->
        <input
          type="text"
          id="searchInput"
          placeholder="Search anime, manga..."
          autofocus
        />
      </div>
      <div class="nav-links">
        <a href="/browse.html">Browse</a>
        <a href="/">Anime</a>
        <a href="/">Manga</a>
        <a href="/myspace.html">My Space</a>
        <a href="/profile.html">Profile</a>
      </div>
      <div class="nav-auth" id="navAuth"></div>
    </nav>

    <!-- ② SEARCH HEADER — shown once user has typed -->
    <div class="search-header" id="searchHeader" style="display: none">
      <div class="search-query-title">
        Results for <span id="queryDisplay"></span>
      </div>
      <div class="search-meta" id="searchMeta"></div>
    </div>

    <!-- ③ RESULTS GRID -->
    <div class="results-section">
      <div class="results-grid" id="resultsGrid"></div>

      <!-- EMPTY STATE -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">No results found</div>
        <div class="empty-sub" id="emptySubtext"></div>
      </div>

      <!--
        SENTINEL + SPINNER
        sentinel = invisible div that IntersectionObserver watches
        When sentinel scrolls into view → load next page
      -->
      <div class="sentinel" id="sentinel">
        <div class="spinner" id="spinner"></div>
      </div>
    </div>

    <!-- ④ INITIAL PROMPT — before user types -->
    <div class="start-prompt" id="startPrompt">
      <div class="start-prompt-icon">⌕</div>
      <div class="start-prompt-text">Search AniBase</div>
      <div class="start-prompt-sub">10,000 anime and manga titles</div>
    </div>

    <script>
      const API = "http://localhost:8000";

      let currentQuery = "";
      let currentPage = 1;
      let isLoading = false;
      let hasMore = true;
      let debounceTimer = null;
      const PAGE_SIZE = 20;

      const searchInput = document.getElementById("searchInput");
      const resultsGrid = document.getElementById("resultsGrid");
      const searchHeader = document.getElementById("searchHeader");
      const queryDisplay = document.getElementById("queryDisplay");
      const searchMeta = document.getElementById("searchMeta");
      const emptyState = document.getElementById("emptyState");
      const emptySubtext = document.getElementById("emptySubtext");
      const startPrompt = document.getElementById("startPrompt");
      const spinner = document.getElementById("spinner");
      const sentinelEl = document.getElementById("sentinel");

      // ── Skeletons ─────────────────────────────────────────
      function createSkeletonCard() {
        const card = document.createElement("div");
        card.className = "skeleton-card";
        card.innerHTML = `
    <div class="skeleton-img"></div>
    <div class="skeleton-line"></div>
    <div class="skeleton-line short"></div>
  `;
        return card;
      }

      function showSkeletons(n = 20) {
        for (let i = 0; i < n; i++) {
          resultsGrid.appendChild(createSkeletonCard());
        }
      }

      function removeSkeletons() {
        resultsGrid
          .querySelectorAll(".skeleton-card")
          .forEach((el) => el.remove());
      }

      // ── Single input listener with debounce ───────────────
      searchInput.addEventListener("input", function () {
        const q = searchInput.value.trim();
        clearTimeout(debounceTimer);
        if (!q) {
          resetUI();
          history.replaceState(null, "", "/search.html");
          return;
        }
        debounceTimer = setTimeout(function () {
          startSearch(q);
        }, 400);
      });

      // ── Enter key also triggers search immediately ────────
      searchInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          const q = searchInput.value.trim();
          clearTimeout(debounceTimer);
          if (q)
            window.location.href = `/browse.html?q=${encodeURIComponent(q)}`;
        }
      });

      function startSearch(q) {
        currentQuery = q;
        currentPage = 1;
        hasMore = true;
        resultsGrid.innerHTML = "";
        searchHeader.style.display = "block";
        startPrompt.style.display = "none";
        emptyState.classList.remove("visible");
        queryDisplay.textContent = `"${q}"`;
        searchMeta.textContent = "Searching...";
        history.replaceState(
          null,
          "",
          `/search.html?q=${encodeURIComponent(q)}`,
        );
        fetchResults();
      }

      async function fetchResults() {
        if (isLoading || !hasMore) return;
        isLoading = true;
        spinner.classList.add("visible");
        if (currentPage === 1) showSkeletons(20);
        try {
          const res = await fetch(
            `${API}/media/search?q=${encodeURIComponent(currentQuery)}&page=${currentPage}&page_size=${PAGE_SIZE}`,
          );
          const items = await res.json();
          if (items.length < PAGE_SIZE) hasMore = false;
          if (currentPage === 1 && items.length === 0) {
            emptyState.classList.add("visible");
            emptySubtext.textContent = `No results for "${currentQuery}"`;
            searchMeta.textContent = "0 results";
          } else {
            if (!hasMore) {
              const total = (currentPage - 1) * PAGE_SIZE + items.length;
              searchMeta.textContent = `${total} result${total !== 1 ? "s" : ""}`;
            } else {
              searchMeta.textContent = `Showing ${currentPage * PAGE_SIZE} results`;
            }
            items.forEach(function (media) {
              resultsGrid.appendChild(createCard(media));
            });
            currentPage++;
          }
        } catch (err) {
          console.error("Search error:", err);
          searchMeta.textContent = "Something went wrong.";
        } finally {
          isLoading = false;
          spinner.classList.remove("visible");
          removeSkeletons();
        }
      }

      function createCard(media) {
        const card = document.createElement("div");
        card.className = "media-card";
        const title = media.title_english || media.title_romaji;
        const score = media.average_score
          ? `⭐ ${media.average_score}`
          : "No score";
        const meta = [media.type, media.format].filter(Boolean).join(" · ");
        card.innerHTML = `
      <img src="${media.cover_image_url || ""}" alt="${title}" loading="lazy"/>
      <div class="card-title">${title}</div>
      <div class="card-meta">${meta}</div>
      <div class="card-score">${score}</div>
    `;
        card.onclick = function () {
          window.location.href = `detail.html?id=${media.id}`;
        };
        return card;
      }

      function resetUI() {
        currentQuery = "";
        currentPage = 1;
        hasMore = true;
        isLoading = false;
        resultsGrid.innerHTML = "";
        searchHeader.style.display = "none";
        startPrompt.style.display = "flex";
        emptyState.classList.remove("visible");
        spinner.classList.remove("visible");
      }

      // ── IntersectionObserver for infinite scroll ──────────
      const observer = new IntersectionObserver(
        function (entries) {
          if (entries[0].isIntersecting && currentQuery && hasMore) {
            fetchResults();
          }
        },
        { threshold: 0.1 },
      );
      observer.observe(sentinelEl);

      // ── Load from URL on page load ────────────────────────
      const params = new URLSearchParams(window.location.search);
      const initialQuery = params.get("q") || "";
      if (initialQuery) {
        searchInput.value = initialQuery;
        startSearch(initialQuery);
      }

      // ── Navbar auth state ──────────────────────────────────────────────────────
      function initNavAuth() {
        const token = localStorage.getItem("token");
        const username = localStorage.getItem("username");
        const navAuth = document.getElementById("navAuth");
        if (!navAuth) return;

        if (token && username) {
          navAuth.innerHTML = `
      <a href="/profile.html" class="nav-username">👤 ${username}</a>
      <button class="btn-logout" onclick="logout()">Logout</button>
    `;
        } else {
          const next = encodeURIComponent(
            window.location.pathname + window.location.search,
          );
          navAuth.innerHTML = `
      <a href="/login.html?next=${next}" class="btn-login">Login</a>
    `;
        }
      }

      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        window.location.reload();
      }

      initNavAuth();
    </script>
  </body>
</html>
