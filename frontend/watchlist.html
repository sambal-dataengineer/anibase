<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Watchlist — AniBase</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── CSS Variables ── */
      :root {
        --bg: #0f0f0f;
        --surface: #18181b;
        --border: #27272a;
        --text: #f4f4f5;
        --muted: #71717a;
        --accent: #e85d04;
        --accent-dim: #7c2d00;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
      }

      /* ── Navbar (same as other pages) ── */
      .navbar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(15, 15, 15, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 0 2rem;
        display: flex;
        align-items: center;
        gap: 2rem;
        height: 60px;
      }
      .nav-logo {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.6rem;
        color: var(--accent);
        text-decoration: none;
        letter-spacing: 0.05em;
      }
      .nav-search {
        flex: 1;
        max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.4rem 1rem;
        color: var(--text);
        font-size: 0.875rem;
        outline: none;
      }
      .nav-search:focus {
        border-color: var(--accent);
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        margin-left: auto;
      }
      .nav-links a {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        transition: color 0.2s;
      }
      .nav-links a:hover,
      .nav-links a.active {
        color: var(--text);
      }
      #nav-auth-btn {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 6px;
        padding: 0.4rem 1rem;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }

      /* ── Page layout ── */
      .page-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem;
      }

      /* ── Page header ── */
      .page-header {
        margin-bottom: 2rem;
      }
      .page-header h1 {
        font-family: "Bebas Neue", sans-serif;
        font-size: 2.5rem;
        letter-spacing: 0.04em;
        color: var(--text);
      }
      .page-header .subtitle {
        color: var(--muted);
        font-size: 0.875rem;
        margin-top: 0.25rem;
      }

      /* ── Status tabs ── */
      .tabs {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
      }
      .tab-btn {
        padding: 0.4rem 1.1rem;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
      }
      .tab-btn:hover {
        color: var(--text);
        border-color: var(--muted);
      }
      .tab-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }

      /* ── Watchlist rows ── */
      .watchlist {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .wl-row {
        display: flex;
        align-items: center;
        gap: 1rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.75rem 1rem;
        transition: border-color 0.2s;
      }
      .wl-row:hover {
        border-color: #3f3f46;
      }

      .wl-cover {
        width: 40px;
        height: 56px;
        border-radius: 4px;
        object-fit: cover;
        flex-shrink: 0;
        background: var(--border);
      }

      .wl-info {
        flex: 1;
        min-width: 0;
      }
      .wl-title {
        font-size: 0.95rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-decoration: none;
        color: var(--text);
      }
      .wl-title:hover {
        color: var(--accent);
      }
      .wl-meta {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 0.2rem;
      }
      .type-badge {
        display: inline-block;
        font-size: 0.65rem;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 4px;
        margin-right: 0.4rem;
        letter-spacing: 0.05em;
      }
      .type-badge.anime {
        background: rgba(232, 93, 4, 0.15);
        color: var(--accent);
      }
      .type-badge.manga {
        background: rgba(99, 102, 241, 0.15);
        color: #818cf8;
      }

      .wl-actions {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        flex-shrink: 0;
      }

      .status-select {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-size: 0.75rem;
        padding: 0.3rem 0.6rem;
        cursor: pointer;
        outline: none;
        transition: border-color 0.2s;
      }
      .status-select:focus {
        border-color: var(--accent);
      }

      .remove-btn {
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--muted);
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1rem;
        transition: all 0.15s;
      }
      .remove-btn:hover {
        border-color: #ef4444;
        color: #ef4444;
      }

      /* ── Skeleton ── */
      .skeleton {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.75rem 1rem;
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .sk-cover {
        width: 40px;
        height: 56px;
        border-radius: 4px;
        background: var(--border);
        flex-shrink: 0;
      }
      .sk-lines {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .sk-line {
        height: 12px;
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          var(--border) 25%,
          #3f3f46 50%,
          var(--border) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
      }
      .sk-line.short {
        width: 40%;
      }
      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      /* ── Empty state ── */
      .empty-state {
        text-align: center;
        padding: 4rem 2rem;
        color: var(--muted);
      }
      .empty-state .icon {
        font-size: 2.5rem;
        margin-bottom: 1rem;
      }
      .empty-state p {
        font-size: 0.95rem;
      }
      .empty-state a {
        display: inline-block;
        margin-top: 1rem;
        color: var(--accent);
        font-weight: 500;
        text-decoration: none;
      }
      .empty-state a:hover {
        text-decoration: underline;
      }

      /* ── Mobile ── */
      @media (max-width: 768px) {
        .navbar {
          padding: 0 1rem;
        }
        .nav-search {
          display: none;
        }
        .wl-actions {
          flex-direction: column;
          align-items: flex-end;
          gap: 0.4rem;
        }
        .status-select {
          font-size: 0.7rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <a class="nav-logo" href="/">AniBase</a>
      <input
        class="nav-search"
        type="text"
        placeholder="Search anime, manga..."
        id="nav-search-input"
      />
      <div class="nav-links">
        <a href="/browse.html">Browse</a>
        <a href="/browse.html?type=ANIME">Anime</a>
        <a href="/browse.html?type=MANGA">Manga</a>
        <a href="/watchlist.html" class="active">Watchlist</a>
        <a href="#" id="nav-auth-btn">Login</a>
      </div>
    </nav>

    <!-- Main content -->
    <div class="page-container">
      <div class="page-header">
        <h1>My Watchlist</h1>
        <p class="subtitle" id="item-count">Loading...</p>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab-btn active" data-status="All">All</button>
        <button class="tab-btn" data-status="Ongoing">Ongoing</button>
        <button class="tab-btn" data-status="Shelf">Shelf</button>
        <button class="tab-btn" data-status="Completed">Completed</button>
        <button class="tab-btn" data-status="Dropped">Dropped</button>
      </div>

      <div class="watchlist" id="watchlist-container">
        <!-- Skeletons shown on load -->
      </div>
    </div>

    <script>
      const API = "http://localhost:8000";
      const STATUSES = ["Ongoing", "Shelf", "Completed", "Dropped"];
      let allItems = []; // full watchlist fetched once
      let activeStatus = "All";

      // ── Auth gate ──
      const token = localStorage.getItem("anibase_token");
      if (!token) {
        window.location.href = "/login.html?next=/watchlist.html";
      }

      // ── Nav search ──
      document
        .getElementById("nav-search-input")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter" && e.target.value.trim()) {
            window.location.href = `/browse.html?q=${encodeURIComponent(e.target.value.trim())}`;
          }
        });

      // ── Navbar auth state ──
      function updateNavAuth() {
        const btn = document.getElementById("nav-auth-btn");
        const username = localStorage.getItem("anibase_username");
        if (token && username) {
          btn.textContent = username;
          btn.href = "/profile.html";
          btn.onclick = null;
        } else {
          btn.textContent = "Login";
          btn.href = "/login.html";
        }
      }
      updateNavAuth();

      // ── Skeletons ──
      function showSkeletons(n = 6) {
        const container = document.getElementById("watchlist-container");
        container.innerHTML = Array(n)
          .fill(
            `
        <div class="skeleton">
          <div class="sk-cover"></div>
          <div class="sk-lines">
            <div class="sk-line"></div>
            <div class="sk-line short"></div>
          </div>
        </div>
      `,
          )
          .join("");
      }

      // ── Render rows for active tab ──
      function renderList() {
        const container = document.getElementById("watchlist-container");
        const countEl = document.getElementById("item-count");

        const filtered =
          activeStatus === "All"
            ? allItems
            : allItems.filter((item) => item.status === activeStatus);

        countEl.textContent = `${allItems.length} title${allItems.length !== 1 ? "s" : ""} in your watchlist`;

        if (filtered.length === 0) {
          container.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <p>No titles with status <strong>${activeStatus}</strong> yet.</p>
            <a href="/browse.html">Browse titles →</a>
          </div>`;
          return;
        }

        container.innerHTML = filtered.map((item) => buildRow(item)).join("");
        attachRowListeners();
      }

      // ── Build a single row ──
      function buildRow(item) {
        const type = item.media_type || "ANIME";
        const badgeClass = type === "MANGA" ? "manga" : "anime";
        const statusOptions = STATUSES.map(
          (s) =>
            `<option value="${s}" ${item.status === s ? "selected" : ""}>${s}</option>`,
        ).join("");

        return `
        <div class="wl-row" data-media-id="${item.media_id}">
          <img class="wl-cover"
            src="${item.cover_image_url || ""}"
            alt="${item.title || ""}"
            onerror="this.style.opacity='0'" />
          <div class="wl-info">
            <a class="wl-title" href="/detail.html?id=${item.media_id}">
              ${item.title || "Unknown Title"}
            </a>
            <div class="wl-meta">
              <span class="type-badge ${badgeClass}">${type}</span>
              ${item.media_format ? item.media_format : ""}
            </div>
          </div>
          <div class="wl-actions">
            <select class="status-select" data-media-id="${item.media_id}">
              ${statusOptions}
            </select>
            <button class="remove-btn" data-media-id="${item.media_id}" title="Remove">✕</button>
          </div>
        </div>`;
      }

      // ── Row event listeners ──
      function attachRowListeners() {
        // Status change
        document.querySelectorAll(".status-select").forEach((sel) => {
          sel.addEventListener("change", async (e) => {
            const mediaId = e.target.dataset.mediaId;
            const newStatus = e.target.value;
            await patchStatus(mediaId, newStatus);
          });
        });

        // Remove
        document.querySelectorAll(".remove-btn").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const mediaId = e.currentTarget.dataset.mediaId;
            await removeItem(mediaId);
          });
        });
      }

      // ── PATCH status ──
      async function patchStatus(mediaId, newStatus) {
        try {
          const res = await fetch(`${API}/watchlist/${mediaId}`, {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ status: newStatus }),
          });
          if (!res.ok) throw new Error();
          // Update local data
          const item = allItems.find((i) => i.media_id == mediaId);
          if (item) item.status = newStatus;
        } catch {
          alert("Could not update status. Please try again.");
        }
      }

      // ── DELETE item ──
      async function removeItem(mediaId) {
        try {
          const res = await fetch(`${API}/watchlist/${mediaId}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!res.ok) throw new Error();
          // Remove from local data + re-render
          allItems = allItems.filter((i) => i.media_id != mediaId);
          renderList();
        } catch {
          alert("Could not remove item. Please try again.");
        }
      }

      // ── Tab switching ──
      document.getElementById("tabs").addEventListener("click", (e) => {
        const btn = e.target.closest(".tab-btn");
        if (!btn) return;
        document
          .querySelectorAll(".tab-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeStatus = btn.dataset.status;
        renderList();
      });

      // ── Fetch watchlist ──
      async function loadWatchlist() {
        showSkeletons();
        try {
          const res = await fetch(`${API}/watchlist/`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!res.ok) throw new Error();
          allItems = await res.json();
          renderList();
        } catch {
          document.getElementById("watchlist-container").innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <p>Could not load your watchlist. Please refresh and try again.</p>
          </div>`;
          document.getElementById("item-count").textContent = "";
        }
      }

      loadWatchlist();
    </script>
  </body>
</html>
