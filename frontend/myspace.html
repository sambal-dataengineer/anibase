<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Space — AniBase</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f0f0f;
        --surface: #18181b;
        --border: #27272a;
        --text: #f4f4f5;
        --muted: #71717a;
        --accent: #e85d04;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
      }

      /* ── Navbar ── */
      .navbar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(15, 15, 15, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 0 2rem;
        display: flex;
        align-items: center;
        gap: 2rem;
        height: 60px;
      }
      .nav-logo {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.6rem;
        color: var(--accent);
        text-decoration: none;
      }
      .nav-search {
        flex: 1;
        max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.4rem 1rem;
        color: var(--text);
        font-size: 0.875rem;
        outline: none;
      }
      .nav-search:focus {
        border-color: var(--accent);
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        margin-left: auto;
      }
      .nav-links a {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        transition: color 0.2s;
      }
      .nav-links a:hover,
      .nav-links a.active {
        color: var(--text);
      }
      #nav-auth-btn {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 6px;
        padding: 0.4rem 1rem;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }

      /* ── Layout ── */
      .page-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem;
      }

      /* ── Page header ── */
      .page-header {
        margin-bottom: 1.75rem;
      }
      .page-header h1 {
        font-family: "Bebas Neue", sans-serif;
        font-size: 2.5rem;
        letter-spacing: 0.04em;
      }

      /* ── Type badge ── */
      .type-badge {
        display: inline-block;
        font-size: 0.65rem;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 4px;
        margin-right: 0.4rem;
        letter-spacing: 0.05em;
      }
      .type-badge.anime {
        background: rgba(232, 93, 4, 0.15);
        color: var(--accent);
      }
      .type-badge.manga {
        background: rgba(99, 102, 241, 0.15);
        color: #818cf8;
      }

      /* ── Create list row ── */
      .create-row {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1.75rem;
      }
      .create-input {
        flex: 1;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.6rem 1rem;
        color: var(--text);
        font-size: 0.875rem;
        outline: none;
        transition: border-color 0.2s;
      }
      .create-input:focus {
        border-color: var(--accent);
      }
      .create-btn {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0.6rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .create-btn:hover {
        opacity: 0.85;
      }

      /* ── List cards (accordion) ── */
      .lists-container {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .list-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        transition: border-color 0.2s;
      }
      .list-card:hover {
        border-color: #3f3f46;
      }
      .list-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem 1.25rem;
        cursor: pointer;
        user-select: none;
      }
      .list-icon {
        font-size: 1.1rem;
        flex-shrink: 0;
      }
      .list-name {
        font-size: 0.95rem;
        font-weight: 600;
        flex: 1;
      }
      .list-count {
        font-size: 0.8rem;
        color: var(--muted);
        margin-right: 0.5rem;
      }
      .list-chevron {
        font-size: 0.75rem;
        color: var(--muted);
        transition: transform 0.2s;
      }
      .list-card.open .list-chevron {
        transform: rotate(180deg);
      }
      .delete-list-btn {
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--muted);
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.15s;
        flex-shrink: 0;
      }
      .delete-list-btn:hover {
        border-color: #ef4444;
        color: #ef4444;
      }

      /* ── List items (accordion body) ── */
      .list-items {
        display: none;
        flex-direction: column;
        border-top: 1px solid var(--border);
        padding: 0.5rem 0;
      }
      .list-card.open .list-items {
        display: flex;
      }
      .item-row {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        padding: 0.6rem 1.25rem;
        transition: background 0.15s;
      }
      .item-row:hover {
        background: rgba(255, 255, 255, 0.03);
      }
      .item-cover {
        width: 36px;
        height: 50px;
        border-radius: 4px;
        object-fit: cover;
        flex-shrink: 0;
        background: var(--border);
      }
      .item-info {
        flex: 1;
        min-width: 0;
      }
      .item-title {
        font-size: 0.875rem;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-decoration: none;
        color: var(--text);
      }
      .item-title:hover {
        color: var(--accent);
      }
      .item-meta {
        font-size: 0.72rem;
        color: var(--muted);
        margin-top: 0.15rem;
      }
      .remove-item-btn {
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--muted);
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 0.8rem;
        flex-shrink: 0;
        transition: all 0.15s;
      }
      .remove-item-btn:hover {
        border-color: #ef4444;
        color: #ef4444;
      }
      .items-empty {
        padding: 1.25rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .items-empty a {
        color: var(--accent);
        text-decoration: none;
      }
      .items-empty a:hover {
        text-decoration: underline;
      }

      /* ── Skeletons ── */
      .skeleton-row {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.75rem 1rem;
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .sk-cover {
        width: 40px;
        height: 56px;
        border-radius: 4px;
        background: var(--border);
        flex-shrink: 0;
      }
      .sk-lines {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .sk-line {
        height: 12px;
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          var(--border) 25%,
          #3f3f46 50%,
          var(--border) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
      }
      .sk-line.short {
        width: 40%;
      }
      .sk-title {
        height: 14px;
        border-radius: 4px;
        flex: 1;
        background: linear-gradient(
          90deg,
          var(--border) 25%,
          #3f3f46 50%,
          var(--border) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
      }
      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      /* ── Empty states ── */
      .empty-state {
        text-align: center;
        padding: 4rem 2rem;
        color: var(--muted);
      }
      .empty-state .icon {
        font-size: 2.5rem;
        margin-bottom: 1rem;
      }
      .empty-state p {
        font-size: 0.95rem;
      }
      .empty-state a {
        color: var(--accent);
        text-decoration: none;
      }
      .empty-state a:hover {
        text-decoration: underline;
      }

      /* ── Subtitle ── */
      .section-subtitle {
        color: var(--muted);
        font-size: 0.875rem;
        margin-bottom: 1.25rem;
      }

      /* ── Mobile ── */
      @media (max-width: 768px) {
        .navbar {
          padding: 0 1rem;
        }
        .nav-search {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a class="nav-logo" href="/">AniBase</a>
      <input
        class="nav-search"
        type="text"
        placeholder="Search anime, manga..."
        id="nav-search-input"
      />
      <div class="nav-links">
        <a href="/browse.html">Browse</a>
        <a href="/browse.html?type=ANIME">Anime</a>
        <a href="/browse.html?type=MANGA">Manga</a>
        <a href="/myspace.html" class="active">My Space</a>
        <a href="#" id="nav-auth-btn">Login</a>
      </div>
    </nav>

    <div class="page-container">
      <div class="page-header">
        <h1>My Space</h1>
      </div>

      <!-- My Lists panel -->
      <div id="panel-mylists">
        <div class="create-row">
          <input
            class="create-input"
            type="text"
            id="new-list-input"
            placeholder="New list name..."
            maxlength="100"
          />
          <button class="create-btn" id="create-btn">+ Create</button>
        </div>
        <p class="section-subtitle" id="lists-count"></p>
        <div class="lists-container" id="lists-container"></div>
      </div>
    </div>

    <script>
      const API = "";
      const token = localStorage.getItem("token");
      if (!token) window.location.href = "/login.html?next=/myspace.html";

      async function authFetch(url, options = {}) {
        const res = await fetch(url, {
          ...options,
          headers: {
            Authorization: `Bearer ${localStorage.getItem("token")}`,
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
        });
        if (res.status === 401) {
          localStorage.removeItem("token");
          localStorage.removeItem("username");
          localStorage.removeItem("rank");
          window.location.replace("/login.html?next=/myspace.html");
          return null;
        }
        return res;
      }

      // ── Nav search ──
      document
        .getElementById("nav-search-input")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter" && e.target.value.trim())
            window.location.href = `/browse.html?q=${encodeURIComponent(e.target.value.trim())}`;
        });

      // ── Navbar auth state ──
      function updateNavAuth() {
        const btn = document.getElementById("nav-auth-btn");
        const username = localStorage.getItem("username");
        if (token && username) {
          btn.textContent = `👤 ${username}`;
          btn.href = "/profile.html";
        } else {
          btn.textContent = "Login";
          btn.href = "/login.html";
        }
      }
      updateNavAuth();

      // ═══════════════════════════════════════
      // MY LISTS
      // ═══════════════════════════════════════

      function showListsSkeletons() {
        document.getElementById("lists-container").innerHTML = Array(3)
          .fill(
            `
        <div class="skeleton-row">
          <div class="sk-title"></div>
        </div>`,
          )
          .join("");
      }

      function renderLists(lists) {
        const container = document.getElementById("lists-container");
        const countEl = document.getElementById("lists-count");
        countEl.textContent = `${lists.length} list${lists.length !== 1 ? "s" : ""}`;

        if (lists.length === 0) {
          container.innerHTML = `
          <div class="empty-state">
            <div class="icon">📋</div>
            <p>No lists yet. Create one above.</p>
          </div>`;
          return;
        }

        container.innerHTML = lists
          .map(
            (list) => `
        <div class="list-card" id="list-card-${list.id}" data-list-id="${list.id}">
          <div class="list-header" data-list-id="${list.id}">
            <span class="list-icon">📋</span>
            <span class="list-name">${list.name}</span>
            <span class="list-count" id="count-${list.id}"></span>
            <span class="list-chevron">▼</span>
            <button class="delete-list-btn" data-list-id="${list.id}" title="Delete list">✕</button>
          </div>
          <div class="list-items" id="items-${list.id}"></div>
        </div>`,
          )
          .join("");

        attachListListeners();
      }

      function attachListListeners() {
        document.querySelectorAll(".list-header").forEach((header) => {
          header.addEventListener("click", (e) => {
            if (e.target.closest(".delete-list-btn")) return;
            toggleList(header.dataset.listId);
          });
        });
        document.querySelectorAll(".delete-list-btn").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            await deleteList(btn.dataset.listId);
          });
        });
      }

      async function toggleList(listId) {
        const card = document.getElementById(`list-card-${listId}`);
        const isOpen = card.classList.contains("open");
        if (isOpen) {
          card.classList.remove("open");
          return;
        }
        card.classList.add("open");

        const itemsEl = document.getElementById(`items-${listId}`);
        if (itemsEl.dataset.loaded) return;

        itemsEl.innerHTML = Array(3)
          .fill(
            `
        <div class="item-row">
          <div class="sk-cover" style="width:36px;height:50px;border-radius:4px;background:var(--border);flex-shrink:0;"></div>
          <div class="sk-lines" style="flex:1;display:flex;flex-direction:column;gap:7px;">
            <div class="sk-line"></div><div class="sk-line short"></div>
          </div>
        </div>`,
          )
          .join("");

        try {
          const res = await authFetch(`${API}/lists/${listId}/items`);
          if (!res) return;
          if (!res.ok) throw new Error();
          const items = await res.json();
          itemsEl.dataset.loaded = "true";

          document.getElementById(`count-${listId}`).textContent =
            `${items.length} item${items.length !== 1 ? "s" : ""}`;

          if (items.length === 0) {
            itemsEl.innerHTML = `<div class="items-empty">No items yet. <a href="/browse.html">Browse →</a></div>`;
            return;
          }
          itemsEl.innerHTML = items
            .map((item) => buildItemRow(listId, item))
            .join("");
          attachItemListeners(listId);
        } catch {
          itemsEl.innerHTML = `<div class="items-empty">Could not load items.</div>`;
        }
      }

      function buildItemRow(listId, item) {
        const type = item.media_type || "ANIME";
        const badgeClass = type === "MANGA" ? "manga" : "anime";
        return `
        <div class="item-row" data-media-id="${item.media_id}">
          <img class="item-cover" src="${item.cover_image_url || ""}" alt=""
            onerror="this.style.opacity='0'" />
          <div class="item-info">
            <a class="item-title" href="/detail.html?id=${item.media_id}">${item.title || "Unknown"}</a>
            <div class="item-meta">
              <span class="type-badge ${badgeClass}">${type}</span>
              ${item.media_format || ""}
            </div>
          </div>
          <button class="remove-item-btn"
            data-list-id="${listId}" data-media-id="${item.media_id}" title="Remove">✕</button>
        </div>`;
      }

      function attachItemListeners(listId) {
        document
          .querySelectorAll(`#items-${listId} .remove-item-btn`)
          .forEach((btn) => {
            btn.addEventListener("click", () =>
              removeItem(btn.dataset.listId, btn.dataset.mediaId),
            );
          });
      }

      async function removeItem(listId, mediaId) {
        try {
          const res = await authFetch(
            `${API}/lists/${listId}/items/${mediaId}`,
            { method: "DELETE" },
          );
          if (!res) return;
          if (!res.ok) throw new Error();
          const row = document.querySelector(
            `#items-${listId} [data-media-id="${mediaId}"]`,
          );
          if (row) row.remove();
          const remaining = document.querySelectorAll(
            `#items-${listId} .item-row`,
          ).length;
          document.getElementById(`count-${listId}`).textContent =
            `${remaining} item${remaining !== 1 ? "s" : ""}`;
          if (remaining === 0)
            document.getElementById(`items-${listId}`).innerHTML =
              `<div class="items-empty">No items yet. <a href="/browse.html">Browse →</a></div>`;
        } catch {
          alert("Could not remove item.");
        }
      }

      async function deleteList(listId) {
        if (!confirm("Delete this list? This cannot be undone.")) return;
        try {
          const res = await authFetch(`${API}/lists/${listId}`, {
            method: "DELETE",
          });
          if (!res) return;
          if (!res.ok) throw new Error();
          document.getElementById(`list-card-${listId}`).remove();
          const remaining = document.querySelectorAll(".list-card").length;
          document.getElementById("lists-count").textContent =
            `${remaining} list${remaining !== 1 ? "s" : ""}`;
          if (remaining === 0) renderLists([]);
        } catch {
          alert("Could not delete list.");
        }
      }

      // Create list
      document
        .getElementById("create-btn")
        .addEventListener("click", createList);
      document
        .getElementById("new-list-input")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") createList();
        });

      async function createList() {
        const input = document.getElementById("new-list-input");
        const name = input.value.trim();
        if (!name) return;
        try {
          const res = await authFetch(`${API}/lists/`, {
            method: "POST",
            body: JSON.stringify({ name }),
          });
          if (!res) return;
          if (!res.ok) throw new Error();
          const newList = await res.json();
          input.value = "";

          const container = document.getElementById("lists-container");
          const emptyState = container.querySelector(".empty-state");
          if (emptyState) emptyState.remove();

          const div = document.createElement("div");
          div.innerHTML = `
          <div class="list-card" id="list-card-${newList.id}" data-list-id="${newList.id}">
            <div class="list-header" data-list-id="${newList.id}">
              <span class="list-icon">📋</span>
              <span class="list-name">${newList.name}</span>
              <span class="list-count" id="count-${newList.id}">0 items</span>
              <span class="list-chevron">▼</span>
              <button class="delete-list-btn" data-list-id="${newList.id}" title="Delete list">✕</button>
            </div>
            <div class="list-items" id="items-${newList.id}"></div>
          </div>`;
          container.insertBefore(div.firstElementChild, container.firstChild);

          const total = document.querySelectorAll(".list-card").length;
          document.getElementById("lists-count").textContent =
            `${total} list${total !== 1 ? "s" : ""}`;
          attachListListeners();
        } catch {
          alert("Could not create list.");
        }
      }

      async function loadLists() {
        showListsSkeletons();
        try {
          const res = await authFetch(`${API}/lists/`);
          if (!res) return;
          if (!res.ok) throw new Error();
          renderLists(await res.json());
        } catch {
          document.getElementById("lists-container").innerHTML =
            `<div class="empty-state"><div class="icon">⚠️</div><p>Could not load lists.</p></div>`;
        }
      }

      // ── Boot ──
      loadLists();
    </script>
  </body>
</html>
